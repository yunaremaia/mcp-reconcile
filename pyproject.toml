[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-reconcile"
version = "0.1.0"
description = "Cross-tool MCP configuration drift detection and reconciliation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Yunare Maia", email = "yunare@gmail.com"},
]
keywords = ["mcp", "model-context-protocol", "drift", "configuration", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-reconcile = "mcp_reconcile.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/mcp-reconcile"
Repository = "https://github.com/yunaremaia/mcp-reconcile"
Issues = "https://github.com/yunaremaia/mcp-reconcile/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_reconcile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcp_reconcile --cov-report=term-missing"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/mcp_reconcile"]
branch = true
